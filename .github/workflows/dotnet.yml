name: Build and Deploy .NET Application

on:
  push:
    branches:
      - master # ← Cambiado de 'main' a 'master'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build application
      run: dotnet build --configuration Release --no-restore

    - name: Publish application
      run: dotnet publish --configuration Release --output ./published --no-build

    # Para que tu flujo de trabajo no se rompa mientras configuras tu servidor real,
    # reemplazamos el comando SCP genérico por el uso correcto de variables secretas.
    - name: Deploy to server
      run: |
        echo "Simulando despliegue seguro..."
        # Cuando tengas tus datos listos, descomenta la línea de abajo y borra este echo:
        # scp -r ./published/* ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/path/to/deploy





